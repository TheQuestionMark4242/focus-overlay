name: Build Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt pyinstaller

      - run: pyinstaller --onefile --windowed --name FocusOverlay --distpath dist --workpath build --specpath build main.py

      - uses: actions/upload-artifact@v4
        with:
          name: FocusOverlay
          path: dist/FocusOverlay.exe
