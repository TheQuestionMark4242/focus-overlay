name: Release Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt pyinstaller

      - run: pyinstaller --onefile --windowed --name FocusOverlay --distpath dist --workpath build --specpath build main.py

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/FocusOverlay.exe
